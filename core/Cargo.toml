[package]
name = "voxflow-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["local-whisper"]
local-whisper = ["dep:whisper-rs"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
whisper-rs = { version = "0.16", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "rustls"] }
arboard = "3"
enigo = "0.6"
sha2 = "0.10"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "isomp4", "aac", "ogg", "vorbis", "flac"] }
