[package]
name = "voxflow"
version.workspace = true
description = "VoxFlow: desktop voice dictation app"
edition.workspace = true

[lib]
name = "voxflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voxflow-core = { path = "../core" }
# Default `v1` feature = Windows Credential Manager + Secret Service (zbus) on Linux.
# 4.x has no store-only mode: without `v1` (or `cli`) the crate is a compile_error.
keyring = "4.2"
